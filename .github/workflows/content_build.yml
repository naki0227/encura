name: Content Build

# Builds content migrations on a GitHub runner, for when the machine that
# researched the candidates cannot reach Wikidata/Commons itself (they rate-
# limit some cloud addresses). Push candidate JSON files to a branch named
# claude/candidates-* under scripts/content/candidates/; the generated
# migration(s) and the Accepted/Rejected report come back as an artifact.
# An empty file scripts/content/candidates/image_credits also runs
# scripts/content/image_credits.py (licenses for already published images).
# Commit the migration on a claude/content-* branch as usual (see
# docs/CONTENT_ROUTINE.md); the candidates branch itself is never merged.
on:
  push:
    branches: [ 'claude/candidates-*' ]
    paths: [ 'scripts/content/candidates/**' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Build migrations
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          status=0
          for f in $(ls scripts/content/candidates/*.json 2>/dev/null); do
            echo "## $f" | tee -a "$RUNNER_TEMP/out/report.md"
            python scripts/content/build_migration.py "$f" --out-dir "$RUNNER_TEMP/out" \
              | tee -a "$RUNNER_TEMP/out/report.md" || status=$?
            # One migration per file: the name carries the second it was written.
            sleep 1
          done
          cat "$RUNNER_TEMP/out/report.md" >> "$GITHUB_STEP_SUMMARY"
          ls "$RUNNER_TEMP/out"
      - name: Image credits for published rows
        if: hashFiles('scripts/content/candidates/image_credits') != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python scripts/content/image_credits.py --out-dir "$RUNNER_TEMP/out" | tee "$RUNNER_TEMP/out/credits.md"
          cat "$RUNNER_TEMP/out/credits.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: content-migrations
          path: ${{ runner.temp }}/out
