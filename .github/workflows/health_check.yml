name: Health Check

on:
  schedule:
    # JST 10:30 = UTC 1:30, after the daily content routine has been merged
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # re-enable the scheduled workflows
  issues: write    # open an issue when something is down

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Check Gemini, Supabase and the Edge Function
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/health_check.py

      # GitHub disables scheduled workflows after 60 days without repository
      # activity; that is what silently stopped the old crawler in 2026-03.
      - name: Keep this schedule enabled
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable health_check.yml --repo "$GITHUB_REPOSITORY" || echo "could not enable"

      - name: Report failure as an issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Health check failed"
          body="$(date -u +%F): ${RUN_URL}"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "Health check failed. Details are in the job summary: ${RUN_URL}"
          fi
