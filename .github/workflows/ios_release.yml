name: iOS Release (TestFlight)

# Builds the app with production settings and uploads it to TestFlight.
# Submitting for App Store review stays a manual step in App Store Connect.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (empty = the one in pubspec.yaml). Must be higher than any uploaded build.'
        required: false
        default: ''
  push:
    tags: [ 'v*' ]

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  testflight:
    runs-on: macos-latest
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 SUPABASE_URL SUPABASE_ANON_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]} (see docs/RELEASE.md)"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Write build config and API key
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          # Optional, not secret (it is in every link): Settings → Secrets and
          # variables → Actions → Variables. Empty hides the art book links.
          AMAZON_ASSOCIATE_TAG: ${{ vars.AMAZON_ASSOCIATE_TAG }}
        run: |
          python3 - <<'PY'
          import base64, binascii, json, os, sys
          config = {k: os.environ[k] for k in ("SUPABASE_URL", "SUPABASE_ANON_KEY")}
          if os.environ.get("AMAZON_ASSOCIATE_TAG", "").strip():
              config["AMAZON_ASSOCIATE_TAG"] = os.environ["AMAZON_ASSOCIATE_TAG"].strip()
          path = os.path.join(os.environ["RUNNER_TEMP"], "prod.json")
          with open(path, "w") as f:
              json.dump(config, f)

          # The secret may hold the .p8 file base64-encoded (with or without
          # line breaks) or the file's text itself; accept both.
          key = os.environ["ASC_KEY_P8_BASE64"].strip()
          if "BEGIN PRIVATE KEY" not in key:
              try:
                  key = base64.b64decode("".join(key.split()), validate=True).decode().strip()
              except (binascii.Error, UnicodeDecodeError):
                  key = ""
          if not (key.startswith("-----BEGIN PRIVATE KEY-----") and key.endswith("-----END PRIVATE KEY-----")):
              print("::error::ASC_KEY_P8_BASE64 is not an App Store Connect key: "
                    "use the base64 of AuthKey_XXXX.p8 (or the file's text)")
              sys.exit(1)
          with open(os.path.join(os.environ["RUNNER_TEMP"], "AuthKey.p8"), "w") as f:
              f.write(key + "\n")
          PY

      - name: Archive and upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          if [[ -n "$BUILD_NUMBER" && ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::build_number must be digits"; exit 1
          fi
          scripts/ios/archive.sh "$RUNNER_TEMP/prod.json" "$RUNNER_TEMP/build" "$BUILD_NUMBER"

      - name: Remove secrets from the runner
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/prod.json"
