name: Mirror Images

# Copies every published image (artworks, Today's Art, news) into the public
# Storage bucket "art-images", resized, so the app does not depend on
# Wikimedia or museum servers at run time. Runs after each production DB
# update, once a day as a catch-up, and by hand. Images that fail (rate
# limits, network) are simply tried again next time; the app falls back to
# the original URL meanwhile.
on:
  workflow_run:
    workflows: [ 'DB Migrations' ]
    types: [ completed ]
    branches: [ main ]
  schedule:
    - cron: '10 2 * * *'   # JST 11:10
  workflow_dispatch:

concurrency:
  group: mirror-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Read the service key for this run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF are not set (see docs/RELEASE.md)"; exit 1
          fi
          # The same CLI and token the DB workflow uses. Keys are printed only
          # into a file and the step's environment, never to the log.
          if ! supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --reveal -o json > "$RUNNER_TEMP/keys.json" 2> "$RUNNER_TEMP/keys.err"; then
            echo "::error::could not read the project's API keys:"; sed 's/sb_secret_[A-Za-z0-9_-]*/***/g; s/eyJ[A-Za-z0-9._-]*/***/g' "$RUNNER_TEMP/keys.err"; exit 1
          fi
          key=$(python3 - "$RUNNER_TEMP/keys.json" <<'PY'
          import json, sys
          keys = json.load(open(sys.argv[1]))
          if isinstance(keys, dict):
              keys = next((v for v in keys.values() if isinstance(v, list)), [])
          pick = next((k for k in keys if k.get("name") == "service_role" and k.get("api_key")), None) \
              or next((k for k in keys if k.get("type") == "secret" and k.get("api_key")), None)
          print(pick["api_key"] if pick else "")
          PY
          )
          rm -f "$RUNNER_TEMP/keys.json"
          if [ -z "$key" ]; then echo "::error::no service key found for the project"; exit 1; fi
          echo "::add-mask::$key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"
      - name: Copy missing images
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: python scripts/content/mirror_images.py | tee -a "$GITHUB_STEP_SUMMARY"
