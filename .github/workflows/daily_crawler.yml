name: Daily Art Crawler

on:
  schedule:
    # JST 9:00 = UTC 0:00
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Do not write to the database'
        type: boolean
        default: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # Each step runs even if an earlier one failed; the job still ends red,
      # so a broken source is visible without blocking the others.
      - name: Exhibitions
        run: python scripts/daily_crawler.py $DRY_RUN_FLAG

      - name: Today's Art
        if: ${{ !cancelled() }}
        run: python scripts/seed_daily_art.py $DRY_RUN_FLAG

      - name: Art news
        if: ${{ !cancelled() }}
        run: python scripts/trend_art_crawler.py $DRY_RUN_FLAG

      - name: Seasonal features
        if: ${{ !cancelled() }}
        run: python scripts/seasonal_exhibitions.py $DRY_RUN_FLAG
