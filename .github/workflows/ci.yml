name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/curator/index.ts
      - run: deno lint supabase/functions/curator/index.ts

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Same script as the TestFlight workflow, unsigned (no App Store
      # Connect key here), so the release path is exercised on every PR.
      - name: Archive (unsigned)
        run: |
          echo '{"SUPABASE_URL":"https://example.supabase.co","SUPABASE_ANON_KEY":"ci-placeholder"}' > "$RUNNER_TEMP/ci.json"
          scripts/ios/archive.sh "$RUNNER_TEMP/ci.json" "$RUNNER_TEMP/build"

  python-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-dev.txt
      - run: pip install -r scripts/requirements-dev.txt
      - run: python -m pytest -q scripts/tests
